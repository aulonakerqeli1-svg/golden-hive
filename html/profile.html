<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - Golden Hive</title>
  <link rel="stylesheet" href="/css/profile.css">
</head>
<body>
<div class="container">
  <!-- SIDEBAR -->
  <nav class="navbar">
    <div class="logo">🐝 Golden Hive</div>
    <div class="nav-links">
      <ul>
        <li><a href="dashboard.html">Home</a></li>
        <li><a href="profile.html" class="active">Profile</a></li>
        <li><a href="messages.html">Messages</a></li>
        <li><a href="subscriptions.html">Subscriptions</a></li>
      
      </ul>
    </div>
    <button onclick="logout()">Logout</button>
  </nav>

  <!-- MAIN CONTENT -->
  <div class="profile-main">
    <h2>User Profile</h2>

    <!-- Profile Info -->
    <div class="profile-info">
      <img src="/avatar.png" alt="Avatar" class="avatar" id="profileAvatar">
      <h3 id="profileName">John Doe</h3>
      <p>Email: <span id="profileEmail">john@example.com</span></p>
      <p>Phone: <span id="profilePhone">+383 44 123 456</span></p>
    </div>

    <!-- Edit Profile Form -->
    <div class="edit-profile">
      <h3>Edit Profile</h3>
      <form id="profileForm">
        <label for="name">Full Name</label>
        <input type="text" id="name">

        <label for="email">Email</label>
        <input type="email" id="email">

        <label for="phone">Phone</label>
        <input type="tel" id="phone">

        <label for="password">Change Password</label>
        <input type="password" id="password" placeholder="New password">

        <label for="avatar">Change Avatar</label>
        <input type="file" id="avatarInput" accept="image/*">

        <button type="submit">Save Changes</button>
      </form>
    </div>
  </div>
</div>


 <script src="/js/profile.js"></script>
</body>
</html>
